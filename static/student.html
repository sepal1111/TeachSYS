<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>學生課程入口 - TeachSYS</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body {
    background: var(--bg-gradient);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  .student-shell { width: 100%; max-width: 640px; }
  .student-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 24px;
    margin-bottom: 16px;
  }
  .student-title { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin: 0 0 4px; }
  .student-subtitle { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
  .field select, .field input {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--input-border); background: var(--input-bg); color: var(--input-text);
    font-size: 1rem; box-sizing: border-box;
  }
  .content-tab-switch { display: flex; gap: 8px; margin-bottom: 14px; }
  .content-tab-btn {
    flex: 1; padding: 10px 12px; border-radius: var(--radius-md); border: 1.5px solid var(--card-border);
    background: var(--card-bg); color: var(--text-muted); font-size: 0.92rem; font-weight: 700; cursor: pointer;
    transition: var(--transition-normal);
  }
  .content-tab-btn.active { border-color: var(--primary-light); color: var(--primary); background: rgba(37, 99, 235, 0.08); }

  .score-summary-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; text-align: center; }
  .score-summary-value { font-size: 1.6rem; font-weight: 800; color: var(--text-main); }
  .score-summary-value.positive { color: var(--accent-positive); }
  .score-summary-value.negative { color: var(--accent-negative); }
  .score-summary-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

  .score-log-item {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);
    padding: 12px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .score-log-title { font-weight: 700; color: var(--text-main); font-size: 0.92rem; }
  .score-log-meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  .score-log-value { font-size: 1.1rem; font-weight: 800; white-space: nowrap; }
  .score-log-value.positive { color: var(--accent-positive); }
  .score-log-value.negative { color: var(--accent-negative); }
  .error-box {
    background: var(--accent-negative-bg); border: 1px solid var(--accent-negative-border);
    color: var(--accent-negative); border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 0.9rem; margin-bottom: 14px; display: none;
  }
  .unit-block { margin-bottom: 18px; }
  .unit-title { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin: 0 0 10px; }
  .subunit-card {
    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md);
    padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-xs);
  }
  .subunit-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .subunit-title { font-weight: 700; color: var(--text-main); font-size: 1.02rem; }
  .viewed-badge {
    font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: var(--radius-full);
    background: var(--accent-positive-bg); color: var(--accent-positive); border: 1px solid var(--accent-positive-border);
  }
  .subunit-desc { color: var(--text-muted); font-size: 0.9rem; white-space: pre-wrap; margin: 8px 0; }
  .material-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .material-link {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--card-border); text-decoration: none; color: var(--text-main); font-size: 0.92rem;
  }
  .material-link:hover { background: #f1f5f9; }
  .yt-embed { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius-sm); overflow: hidden; margin-top: 8px; }
  .yt-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar .who { font-weight: 700; color: var(--text-main); }
  [hidden] { display: none !important; }

  .assignment-panel { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--card-border); }
  .assignment-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
  .assignment-status { font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; }
  .assignment-status.muted { color: var(--text-muted); }
  .assignment-status.positive { color: var(--accent-positive); }
  .assignment-status.warning { color: var(--accent-warning); }
  .assignment-status.negative { color: var(--accent-negative); }
  .assignment-files { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .assignment-file-row { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
  .assignment-file-row a { color: var(--text-main); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .assignment-file-del {
    border: none; background: none; color: var(--accent-negative); cursor: pointer; font-size: 0.9rem; padding: 2px 6px;
  }
  .assignment-form { display: flex; flex-direction: column; gap: 8px; }
  .assignment-form input[type="file"] { font-size: 0.85rem; }
  .assignment-textarea, .assignment-link-input {
    width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--input-border);
    background: var(--input-bg); color: var(--input-text); font-size: 0.92rem; box-sizing: border-box;
  }
  .assignment-textarea { min-height: 70px; resize: vertical; }

  .toast-stack { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
  .toast-item {
    padding: 10px 16px; border-radius: var(--radius-sm); font-size: 0.88rem; font-weight: 600; color: #fff;
    background: var(--text-main); box-shadow: var(--shadow-md); opacity: 0; transform: translateY(8px); transition: var(--transition-normal);
  }
  .toast-item.show { opacity: 1; transform: translateY(0); }
  .toast-item.error { background: var(--accent-negative); }
  .toast-item.success { background: var(--accent-positive); }
</style>
</head>
<body>
  <div class="student-shell">

    <div id="loginView" class="student-card">
      <p class="student-title">📚 學生課程入口</p>
      <p class="student-subtitle">輸入老師提供的登入帳號與密碼，瀏覽課程素材</p>
      <div id="loginError" class="error-box"></div>

      <form id="accountLoginForm">
        <div class="field">
          <label for="accountInput">帳號</label>
          <input id="accountInput" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="accountPasswordInput">密碼</label>
          <input id="accountPasswordInput" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn" style="width:100%;">登入</button>
      </form>
    </div>

    <div id="contentView" hidden>
      <div class="student-card topbar">
        <span class="who" id="whoLabel"></span>
        <button id="logoutBtn" class="btn btn-secondary">登出</button>
      </div>

      <div class="content-tab-switch">
        <button type="button" id="btnContentTabMaterials" class="content-tab-btn active">📚 課程素材</button>
        <button type="button" id="btnContentTabScores" class="content-tab-btn">🌟 我的點數</button>
      </div>

      <div id="materialsTabPane">
        <div id="unitsContainer"></div>
        <div id="emptyState" class="student-card" hidden>老師尚未發布任何課程素材。</div>
      </div>

      <div id="scoresTabPane" hidden>
        <div class="student-card score-summary-card">
          <div class="score-summary-item">
            <div class="score-summary-value" id="scoreTotalValue">0</div>
            <div class="score-summary-label">累積總分</div>
          </div>
          <div class="score-summary-item">
            <div class="score-summary-value positive" id="scoreTodayValue">0</div>
            <div class="score-summary-label">今日獲得</div>
          </div>
          <div class="score-summary-item">
            <div class="score-summary-value positive" id="scorePositiveValue">0</div>
            <div class="score-summary-label">正向加分</div>
          </div>
          <div class="score-summary-item">
            <div class="score-summary-value negative" id="scoreNegativeValue">0</div>
            <div class="score-summary-label">負向扣分</div>
          </div>
        </div>
        <div id="scoreLogsList"></div>
        <div id="scoreEmptyState" class="student-card" hidden>目前還沒有任何點數紀錄。</div>
      </div>
    </div>

  </div>

  <div id="toastStack" class="toast-stack"></div>

  <script src="/static/js/student.js?v=1.3"></script>
</body>
</html>
